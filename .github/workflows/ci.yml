name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nyansa_test
          POSTGRES_USER: nyansa
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nyansa -d nyansa_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DJANGO_SECRET_KEY: ci-only-long-random-looking-secret-key-for-nyansa-test-suite-2026
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DATABASE_URL: postgresql://nyansa:test-password@127.0.0.1:5432/nyansa_test
      ANTHROPIC_API_KEY: test-key
      PAYSTACK_SECRET_KEY: test-key
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 1
      - name: Rehearse production release
        env:
          DJANGO_ENV: production
          DJANGO_ALLOWED_HOSTS: example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.test
          DJANGO_SECURE_SSL_REDIRECT: "True"
          DJANGO_TRUST_PROXY_SSL_HEADER: "True"
          NYANSA_MEDIA_ROOT: /tmp/nyansa-media
        run: |
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          python manage.py production_check
