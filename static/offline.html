<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're offline - Nyansa</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            text-align: center;
            padding: 1.5rem;
        }
        .offline-box {
            max-width: 420px;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #64748b;
            line-height: 1.5;
        }
        button {
            margin-top: 1.25rem;
            background-color: #4f46e5;
            color: #fff;
            border: none;
            padding: 0.65rem 1.25rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>
    <div class="offline-box">
        <h1>You're offline</h1>
        <p>This page hasn't been saved for offline use yet. Reconnect to the internet and try again — anything you already opened while online should still be reachable.</p>
        <button onclick="window.location.reload()">Try again</button>
    </div>
</body>
</html>
