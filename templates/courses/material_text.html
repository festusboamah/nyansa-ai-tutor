{% extends "base.html" %}
{% block title %}{{ material.title }} - Nyansa{% endblock %}
{% block content %}
<h1>{{ material.title }}</h1>
<p><a href="{% url 'subject_detail' material.subject_id %}">&larr; Back to {{ material.subject.name }}</a></p>

<div class="card">
    {% if text %}
        <pre class="material-text">{{ text }}</pre>
    {% else %}
        <p>No text could be extracted from this material.</p>
    {% endif %}
</div>
{% endblock %}
