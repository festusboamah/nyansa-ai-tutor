{% extends "base.html" %}
{% block title %}Add Material - Nyansa{% endblock %}
{% block content %}
<div class="card form-card">
    <h1>Add Learning Material</h1>

        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-small">Add Material</button>
    </form>
</div>
{% endblock %}
