{% extends "base.html" %}
{% block title %}Reset Password - Nyansa{% endblock %}
{% block content %}
<div class="card form-card">
    <h1>Reset your password</h1>
    <p>Enter the email address on your account and we'll send you a link to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-small">Send reset link</button>
    </form>
    <p><a href="{% url 'login' %}">Back to login</a></p>
</div>
{% endblock %}
